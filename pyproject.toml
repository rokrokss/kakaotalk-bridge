[project]
name = "kakaotalk-bridge"
version = "0.1.0"
description = "직접 호스팅하는 카카오톡 메시지 수집 및 AI 에이전트용 MCP 연결"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "mcp>=1.9,<2",
    "cryptography>=46,<51",
    "webauthn>=2.7,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
