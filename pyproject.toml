[project]
name = "kakaotalk-bridge"
version = "0.1.0"
description = "Self-hosted KakaoTalk message collection and MCP access for AI agents"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp>=1.9,<2", "cryptography>=46,<51"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
