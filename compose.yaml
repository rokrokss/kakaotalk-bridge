name: ${COMPOSE_PROJECT_NAME:-kakaotalk-collector}

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-server: &server
  image: ${COLLECTOR_IMAGE:-kakaotalk-collector/server:0.1.0}
  build:
    context: .
    dockerfile: docker/server.Dockerfile
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 1g
  pids_limit: 256
  logging: *logging

x-device: &device
  image: ${DEVICE_IMAGE:-kakaotalk-collector/device:0.1.0}
  build:
    context: .
    dockerfile: docker/device.Dockerfile
    secrets: [bridge_keystore, bridge_key_password]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 1g
  pids_limit: 256
  logging: *logging

services:
  adb-init:
    <<: *device
    entrypoint: [python, -m, device.adb_auth]
    command: []
    restart: "no"
    network_mode: none
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes: [device-state:/device-state, iris-state:/iris-state, android-data:/android-data]

  redroid:
    image: ${REDROID_IMAGE:-redroid/redroid:14.0.0-latest@sha256:a3e654caad74faed03cd5ead057a989e06f507778cda678e5d3b9772e0092f1c}
    privileged: true
    restart: "no"
    command:
      - androidboot.redroid_width=1200
      - androidboot.redroid_height=1920
      - androidboot.redroid_dpi=240
      - androidboot.redroid_fps=15
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=1
      - ro.build.characteristics=tablet
      - ro.product.model=SM-T970
      - ro.product.brand=Samsung
      - ro.adb.secure=1
    volumes: [android-data:/data]
    ports: ["127.0.0.1:${ADB_PORT:-5555}:5555"]
    networks: [device-net]
    mem_limit: 4g
    pids_limit: 2048
    depends_on:
      adb-init:
        condition: service_completed_successfully
    logging: *logging

  api:
    <<: *server
    restart: unless-stopped
    environment:
      DEVICE_ID: ${DEVICE_ID:-personal-tablet}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      DB_PATH: /data/collector.db
    secrets: [ingest_token, read_token, send_token, device_token, backup_key]
    volumes: [collector-data:/data]
    networks: [backend-net, public-read-net]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  gateway:
    image: ${GATEWAY_IMAGE:-kakaotalk-collector/gateway:2.11.7}
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The upstream caddy binary carries this file capability; keep it in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    tmpfs: [/tmp, /config, /data]
    volumes: [./docker/Caddyfile:/etc/caddy/Caddyfile:ro]
    secrets: [tls_cert, tls_key]
    ports: ["${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"]
    networks:
      device-net:
        ipv4_address: ${GATEWAY_IP:-172.29.87.3}
      backend-net: {}
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  device-agent:
    <<: *device
    restart: unless-stopped
    environment:
      ADB_TARGET: redroid:5555
      DEVICE_ID: ${DEVICE_ID:-personal-tablet}
      API_URL: http://api:8000
    volumes: [device-state:/state]
    secrets: [device_token]
    networks: [device-net, backend-net]
    depends_on:
      redroid:
        condition: service_started
      api:
        condition: service_healthy

  iris-collector:
    <<: *device
    command: [iris-watch]
    restart: unless-stopped
    environment:
      ADB_TARGET: redroid:5555
      DEVICE_ID: ${DEVICE_ID:-personal-tablet}
      API_URL: http://api:8000
    volumes: [iris-state:/state]
    secrets: [ingest_token]
    networks: [device-net, backend-net]
    depends_on:
      redroid:
        condition: service_started
      api:
        condition: service_healthy

  admin:
    <<: *device
    command: [web-ui]
    restart: unless-stopped
    environment:
      ADB_TARGET: redroid:5555
      DEVICE_ID: ${DEVICE_ID:-personal-tablet}
      API_URL: http://api:8000
      BRIDGE_URL: https://${GATEWAY_IP:-172.29.87.3}:8443
      ADMIN_AUTH_DB: /auth/admin.db
      ADMIN_AUTH_MODE: ${ADMIN_AUTH_MODE:-passkey}
      ADMIN_LOCAL_ORIGIN: ${ADMIN_LOCAL_ORIGIN:-}
      DOT_CONTROL_URL: http://dot-control:8788
    volumes:
      - device-state:/state
      - admin-state:/auth
      - ./inputs/kakao:/inputs/kakao:ro
      - ./.bridge/setup-agent:/run/bridge-setup:ro
    secrets: [admin_token, read_token, ingest_token, tls_cert, mcp_approval_token]
    networks: [device-net, backend-net, private-control-net, admin-ingress-net]
    depends_on:
      redroid:
        condition: service_started
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  bootstrap:
    <<: *device
    profiles: [setup]
    command: [bootstrap]
    environment:
      ADB_TARGET: redroid:5555
      DEVICE_ID: ${DEVICE_ID:-personal-tablet}
      BRIDGE_URL: https://${GATEWAY_IP:-172.29.87.3}:8443
    volumes:
      - device-state:/state
      - ./inputs/kakao:/inputs/kakao:ro
    secrets: [ingest_token, tls_cert]
    networks: [device-net]
    depends_on:
      redroid:
        condition: service_started

  # Browser-only loopback entry point, also usable through SSH forwarding.
  admin-local:
    image: ${GATEWAY_IMAGE:-kakaotalk-collector/gateway:2.11.7}
    profiles: [local-admin]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    tmpfs: [/tmp, "/config:uid=10001,gid=10001,mode=0700", "/data:uid=10001,gid=10001,mode=0700"]
    environment:
      ADMIN_LOCAL_HOST: ${ADMIN_LOCAL_HOST:-localhost:18789}
    volumes: [./docker/Caddyfile.local:/etc/caddy/Caddyfile:ro]
    ports: ["127.0.0.1:${ADMIN_LOCAL_PORT:-18789}:8785"]
    networks: [admin-ingress-net, local-admin-edge-net]
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:8785/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *logging

  mcp:
    <<: *server
    profiles: [mcp]
    command: [python, -m, server.mcp_adapter]
    stdin_open: true
    environment:
      API_URL: http://api:8000
    secrets: [read_token, send_token]
    networks: [backend-net]

  dot-plugin:
    <<: *server
    image: ${DOT_IMAGE:-kakaotalk-collector/dot:0.1.0}
    profiles: [dot]
    restart: unless-stopped
    command: [uvicorn, dot_plugin.app:create_app, --factory, --host, 0.0.0.0, --port, "8787", --no-access-log]
    environment:
      API_URL: http://api:8000
      DOT_PUBLIC_URL: ${DOT_PUBLIC_URL:-https://kakao.example.invalid}
      DOT_DB_PATH: /data/dot.db
      DOT_APPROVAL_MODE: ${DOT_APPROVAL_MODE:-passkey}
      OPENAI_TUNNEL_ID: ${OPENAI_TUNNEL_ID:-}
      OPENAI_TUNNEL_ENABLED: ${OPENAI_TUNNEL_ENABLED:-0}
    secrets: [read_token, send_token, mcp_link_key, mcp_storage_key, mcp_passkey_token]
    volumes: [dot-state:/data]
    networks: [public-read-net, public-assertion-net, public-ingress-net, dot-net]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  dot-ingress:
    image: ${GATEWAY_IMAGE:-kakaotalk-collector/gateway:2.11.7}
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    profiles: [dot]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    tmpfs: [/tmp, "/config:uid=10001,gid=10001,mode=0700", "/data:uid=10001,gid=10001,mode=0700"]
    volumes: [./docker/Caddyfile.public:/etc/caddy/Caddyfile:ro]
    ports: ["127.0.0.1:${DOT_HTTP_PORT:-18787}:8786"]
    # Docker does not publish ports for containers on exclusively internal networks.
    networks: [public-ingress-net, admin-ingress-net, public-edge-net]
    depends_on:
      dot-plugin:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:8786/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  dot-control:
    <<: *server
    image: ${DOT_IMAGE:-kakaotalk-collector/dot:0.1.0}
    profiles: [dot]
    restart: unless-stopped
    command: [uvicorn, dot_plugin.control:create_app, --factory, --host, 0.0.0.0, --port, "8788", --no-access-log]
    environment:
      DOT_PUBLIC_URL: ${DOT_PUBLIC_URL:-https://kakao.example.invalid}
      DOT_DB_PATH: /data/dot.db
      DOT_APPROVAL_MODE: ${DOT_APPROVAL_MODE:-passkey}
      OPENAI_TUNNEL_ID: ${OPENAI_TUNNEL_ID:-}
      OPENAI_TUNNEL_ENABLED: ${OPENAI_TUNNEL_ENABLED:-0}
    secrets: [mcp_storage_key, mcp_approval_token, mcp_passkey_token]
    volumes: [dot-state:/data, passkey-state:/passkeys]
    networks: [private-control-net, public-assertion-net]

  # No published ports and no connection to the public ingress or Android.
  dot-tunnel:
    <<: *server
    image: ${DOT_IMAGE:-kakaotalk-collector/dot:0.1.0}
    profiles: [tunnel]
    restart: unless-stopped
    command: [uvicorn, dot_plugin.tunnel:create_app, --factory, --host, 0.0.0.0, --port, "8789", --no-access-log]
    environment:
      API_URL: http://api:8000
      DOT_PUBLIC_URL: ${DOT_PUBLIC_URL:-https://kakao.example.invalid}
      DOT_DB_PATH: /data/dot.db
      DOT_APPROVAL_MODE: ${DOT_APPROVAL_MODE:-passkey}
      OPENAI_TUNNEL_ID: ${OPENAI_TUNNEL_ID:-}
      OPENAI_TUNNEL_ENABLED: ${OPENAI_TUNNEL_ENABLED:-0}
    secrets: [read_token, send_token, mcp_storage_key, mcp_passkey_token, mcp_tunnel_authorization]
    volumes: [dot-state:/data]
    networks: [public-read-net, public-assertion-net, tunnel-mcp-net]
    depends_on:
      dot-plugin:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8789/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  openai-tunnel:
    image: ${OPENAI_TUNNEL_IMAGE:-ghcr.io/openai/tunnel-client:v0.0.15}
    user: "65532:65532"
    profiles: [tunnel]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    tmpfs: [/tmp]
    command: [--control-plane.api-key=file:/run/secrets/openai_tunnel_api_key]
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${OPENAI_TUNNEL_ID:-}
      MCP_SERVER_URL: http://dot-tunnel:8789/mcp
      # Docker daemon restarts do not honor Compose dependency readiness.
      MCP_STARTUP_WAIT_TIMEOUT: 60s
      MCP_EXTRA_HEADERS: "X-Bridge-Tunnel-Authorization: file:/run/secrets/mcp_tunnel_authorization"
      MCP_DISCOVERY_EXTRA_HEADERS: "X-Bridge-Tunnel-Authorization: file:/run/secrets/mcp_tunnel_authorization"
      HEALTH_LISTEN_ADDR: 0.0.0.0:8080
    secrets: [openai_tunnel_api_key, mcp_tunnel_authorization]
    networks: [tunnel-mcp-net, tunnel-egress-net]
    depends_on:
      dot-tunnel:
        condition: service_healthy
    logging: *logging

volumes:
  android-data:
  collector-data:
  device-state:
  iris-state:
  dot-state:
  admin-state:
  passkey-state:

networks:
  device-net:
    ipam:
      config:
        - subnet: ${DEVICE_SUBNET:-172.29.87.0/24}
          # Keep automatic assignments away from the fixed gateway IP after daemon restarts.
          ip_range: ${DEVICE_IP_RANGE:-172.29.87.128/25}
  backend-net:
    internal: true
  public-read-net:
    internal: true
  private-control-net:
    internal: true
  public-assertion-net:
    internal: true
  public-ingress-net:
    internal: true
  admin-ingress-net:
    internal: true
  public-edge-net:
  local-admin-edge-net:
  dot-net:
  tunnel-mcp-net:
    internal: true
  tunnel-egress-net:

secrets:
  admin_token:
    file: ./secrets/admin_token
  ingest_token:
    file: ./secrets/ingest_token
  read_token:
    file: ./secrets/read_token
  send_token:
    file: ./secrets/send_token
  device_token:
    file: ./secrets/device_token
  tls_cert:
    file: ./secrets/tls_cert.pem
  tls_key:
    file: ./secrets/tls_key.pem
  bridge_keystore:
    file: ./secrets/bridge.jks
  bridge_key_password:
    file: ./secrets/bridge_key_password
  backup_key:
    file: ./secrets/backup_key
  mcp_link_key:
    file: ./secrets/mcp_link_key
  mcp_storage_key:
    file: ./secrets/mcp_storage_key
  mcp_approval_token:
    file: ./secrets/mcp_approval_token
  mcp_passkey_token:
    file: ./secrets/mcp_passkey_token
  mcp_tunnel_authorization:
    file: ./secrets/mcp_tunnel_authorization
  openai_tunnel_api_key:
    file: ./secrets/openai_tunnel_api_key
