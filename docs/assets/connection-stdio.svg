<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="364" viewBox="0 0 1120 364" role="img" aria-labelledby="title desc">
<title id="title">클라이언트에서 실행하는 stdio</title>
<desc id="desc">MCP 클라이언트가 어댑터를 실행하고 표준 입출력으로 통신합니다. 원격 서버에는 SSH를 사용할 수 있습니다. 어댑터는 읽기 토큰으로 수집 API에서 메시지를 조회합니다. 공개 MCP URL은 필요하지 않습니다.</desc>
<defs>
<marker id="arrow-line" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#85857b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#3b697f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-goldink" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#8c691e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#47735e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="364" rx="20" fill="#faf9f6" stroke="none"/>
<rect x="32" y="30" width="44" height="34" rx="9" fill="#f6df80" stroke="none"/>
<text x="54" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#242320" text-anchor="middle">03</text>
<text x="92" y="55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="650" fill="#242320" text-anchor="start">클라이언트에서 실행하는 stdio</text>
<text x="32" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#6f7069" text-anchor="start">로컬 MCP 명령이 어댑터를 실행합니다. 원격 서버에는 SSH를 사용하세요.</text>
<rect x="876" y="32" width="212" height="30" rx="15.0" fill="#ffffff" stroke="none"/>
<text x="982.0" y="50.85" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6f7069" text-anchor="middle">클라이언트가 실행</text>
<rect x="344" y="116" width="744" height="180" rx="14" fill="#f1efe7" stroke="#dedad0"/>
<text x="364" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#6f7069" text-anchor="start">내 서버 / VM</text>
<rect x="32" y="176" width="200" height="98" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="48" y="195" width="5" height="24" rx="2" fill="#3b697f" stroke="none"/>
<text x="64" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#242320" text-anchor="start">MCP 클라이언트</text>
<text x="50" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">명령 실행</text>
<rect x="368" y="176" width="192" height="98" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="384" y="195" width="5" height="24" rx="2" fill="#f6df80" stroke="none"/>
<text x="400" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#242320" text-anchor="start">stdio 어댑터</text>
<text x="386" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">클라이언트가 관리</text>
<rect x="696" y="176" width="192" height="98" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="712" y="195" width="5" height="24" rx="2" fill="#f6df80" stroke="none"/>
<text x="728" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#242320" text-anchor="start">수집 API</text>
<text x="714" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">메시지 조회·전송</text>
<rect x="976" y="176" width="88" height="98" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="992" y="195" width="5" height="24" rx="2" fill="#f6df80" stroke="none"/>
<text x="1008" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#242320" text-anchor="start">데이터</text>
<text x="994" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">메시지</text>
<path d="M243 225 L357 225" fill="none" stroke="#3b697f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
<text x="300" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#3b697f" text-anchor="middle">표준 입력 / 출력</text>
<text x="300" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#6f7069" text-anchor="middle">원격이면 SSH</text>
<path d="M571 225 L685 225" fill="none" stroke="#85857b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-line)" marker-end="url(#arrow-line)"/>
<text x="628" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#6f7069" text-anchor="middle">내부 HTTP</text>
<text x="628" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#6f7069" text-anchor="middle">읽기 토큰</text>
<path d="M899 225 L965 225" fill="none" stroke="#85857b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-line)" marker-end="url(#arrow-line)"/>
<text x="932" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#6f7069" text-anchor="middle">조회</text>
<text x="32" y="333" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">공개 MCP URL이 필요 없습니다. 클라이언트가 어댑터를 시작·종료하며 수집기는 별도로 실행됩니다.</text>
</svg>
