<text x="994" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">Messages</text>
<path d="M243 225 L357 225" fill="none" stroke="#3b697f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
<text x="300" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#3b697f" text-anchor="middle">stdin / stdout</text>
<text x="300" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#6f7069" text-anchor="middle">SSH if remote</text>
<path d="M571 225 L685 225" fill="none" stroke="#85857b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-line)" marker-end="url(#arrow-line)"/>
<text x="628" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#6f7069" text-anchor="middle">Internal HTTP</text>
<text x="628" y="251" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#6f7069" text-anchor="middle">Read token</text>
<path d="M899 225 L965 225" fill="none" stroke="#85857b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-line)" marker-end="url(#arrow-line)"/>
<text x="932" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#6f7069" text-anchor="middle">Read</text>
<text x="32" y="333" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">No public MCP URL. The client starts and stops the adapter; your collector runs separately.</text>
