<rect x="384" y="195" width="5" height="24" rx="2" fill="#f6df80" stroke="none"/>
<text x="400" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#242320" text-anchor="start">stdio adapter</text>
<text x="386" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">Client-owned process</text>
