<svg xmlns="http://www.w3.org/2000/svg" width="392" height="856" viewBox="0 0 392 856" role="img" aria-labelledby="title desc">
<title id="title">수집한 메시지에 대해 AI에게 물어보세요</title><desc id="desc">가상 예시: 같은 카페의 금요일 모임이 저녁 7시에서 7시 30분으로 바뀝니다. 연결된 AI가 수집한 두 메시지를 근거로 변경 내용을 설명합니다.</desc>
<rect x="0.5" y="0.5" width="391" height="855" rx="24" fill="#f7f8f2" stroke="#dedfd5"/>
<text x="26" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="11" font-weight="650" fill="#676b61" text-anchor="start">내 대화에서 찾는 답</text><text x="26" y="78" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="28" font-weight="650" fill="#272720" text-anchor="start">수집한 메시지로</text><text x="26" y="112" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="28" font-weight="650" fill="#272720" text-anchor="start">물어보세요.</text><g transform="translate(26 138)"><rect x="0" y="0" width="340" height="300" rx="18" fill="white" stroke="#dedfd5"/><g transform="translate(18 20) scale(0.21875)"><rect width="128" height="128" rx="28" fill="#f6df80"/><path d="M39 27h50a13 13 0 0 1 13 13v35a13 13 0 0 1-13 13H62l-22 17V88h-1a13 13 0 0 1-13-13V40a13 13 0 0 1 13-13Z" fill="#272720"/></g><text x="57" y="41" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#272720" text-anchor="start">수집한 메시지</text><rect x="18" y="70" width="288" height="78" rx="10" fill="#f0f2eb" stroke="none"/><text x="32" y="100" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#272720" text-anchor="start">금요일 모임은 저녁 7시야.</text><text x="32" y="125" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#272720" text-anchor="start">지난번 그 카페에서 만나.</text><text x="18" y="174" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#676b61" text-anchor="start">같은 대화의 다음 메시지</text><rect x="34" y="193" width="288" height="83" rx="10" fill="#f6df80" stroke="none"/><text x="48" y="223" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#272720" text-anchor="start">금요일 모임이</text><text x="48" y="250" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#272720" text-anchor="start">7시 반으로 바뀌었어. 장소는 그대로.</text></g><path d="M196 453v21m-6-6 6 6 6-6" stroke="#456851" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(26 490)"><rect x="0" y="0" width="340" height="309" rx="18" fill="#eef3ea" stroke="#d6dfd0"/><text x="18" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#456851" text-anchor="start">연결한 AI</text><rect x="18" y="53" width="304" height="75" rx="10" fill="white" stroke="none"/><text x="31" y="82" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#272720" text-anchor="start">금요일 모임은 몇 시야?</text><text x="31" y="107" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#272720" text-anchor="start">장소도 바뀌었어?</text><text x="18" y="169" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" fill="#272720" text-anchor="start">저녁 7시 30분, 같은 카페예요.</text><text x="18" y="204" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#456851" text-anchor="start">시간은 7시에서</text><text x="18" y="231" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#456851" text-anchor="start">7시 30분으로 바뀌었어요.</text><path d="M18 249h304" stroke="#d6dfd0" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="274" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#456851" text-anchor="start">AI가 조회한 메시지를</text><text x="18" y="294" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#456851" text-anchor="start">근거로 답합니다.</text></g><text x="26" y="824" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#676b61" text-anchor="start">이해를 돕기 위한 가상 메시지와</text><text x="26" y="842" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#676b61" text-anchor="start">AI 답변 예시입니다.</text>
</svg>
