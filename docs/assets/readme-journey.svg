<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc">
<title id="title">Three steps to your first answer</title><desc id="desc">Open the bridge in your browser, sign in to KakaoTalk as a secondary device and confirm your phone, then connect an AI and try a message you sent. Illustrative UI.</desc>
<rect x="0.5" y="0.5" width="1119" height="529" rx="24" fill="#f7f8f2" stroke="#dedfd5"/>
<text x="26" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" fill="#676b61" text-anchor="start">YOUR FIRST ANSWER STARTS HERE</text><text x="26" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="34" font-weight="650" fill="#272720" text-anchor="start">Three steps. One bridge.</text><g transform="translate(26 110)"><rect x="0" y="0" width="340" height="382" rx="18" fill="white" stroke="#dedfd5"/><rect x="22" y="22" width="34" height="34" rx="10" fill="#f6df80" stroke="none"/><text x="39" y="46" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#272720" text-anchor="middle">1</text><text x="22" y="91" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" fill="#272720" text-anchor="start">Open your bridge</text><rect x="22" y="115" width="296" height="164" rx="12" fill="#f7f8f4" stroke="#dedfd5"/><path d="M22 147h296" stroke="#dedfd5" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38" cy="132" r="3" fill="#babeb2"/><circle cx="49" cy="132" r="3" fill="#babeb2"/><circle cx="60" cy="132" r="3" fill="#babeb2"/><g transform="translate(38 165) scale(0.2265625)"><rect width="128" height="128" rx="28" fill="#f6df80"/><path d="M39 27h50a13 13 0 0 1 13 13v35a13 13 0 0 1-13 13H62l-22 17V88h-1a13 13 0 0 1-13-13V40a13 13 0 0 1 13-13Z" fill="#272720"/></g><text x="78" y="186" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" fill="#272720" text-anchor="start">Your bridge</text><rect x="38" y="206" width="78" height="48" rx="7" fill="white" stroke="#dedfd5"/><rect x="48" y="218" width="37" height="5" rx="2" fill="#dfe3d6" stroke="none"/><rect x="48" y="233" width="55" height="7" rx="2" fill="#f6df80" stroke="none"/><rect x="128" y="206" width="78" height="48" rx="7" fill="white" stroke="#dedfd5"/><rect x="138" y="218" width="37" height="5" rx="2" fill="#dfe3d6" stroke="none"/><rect x="138" y="233" width="55" height="7" rx="2" fill="#f6df80" stroke="none"/><rect x="218" y="206" width="78" height="48" rx="7" fill="white" stroke="#dedfd5"/><rect x="228" y="218" width="37" height="5" rx="2" fill="#dfe3d6" stroke="none"/><rect x="228" y="233" width="55" height="7" rx="2" fill="#f6df80" stroke="none"/><text x="22" y="322" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#676b61" text-anchor="start">Run one command.</text><text x="22" y="351" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#676b61" text-anchor="start">Continue in your browser.</text></g><g transform="translate(390 110)"><rect x="0" y="0" width="340" height="382" rx="18" fill="white" stroke="#dedfd5"/><rect x="22" y="22" width="34" height="34" rx="10" fill="#f6df80" stroke="none"/><text x="39" y="46" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#272720" text-anchor="middle">2</text><text x="22" y="91" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" fill="#272720" text-anchor="start">Sign in to KakaoTalk</text><rect x="83" y="112" width="105" height="159" rx="14" fill="#f2f4eb" stroke="#272720"/><path d="M121 123h27" stroke="#676b61" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(112 154) scale(0.375)"><rect width="128" height="128" rx="28" fill="#f6df80"/><path d="M39 27h50a13 13 0 0 1 13 13v35a13 13 0 0 1-13 13H62l-22 17V88h-1a13 13 0 0 1-13-13V40a13 13 0 0 1 13-13Z" fill="#272720"/></g><circle cx="135" cy="233" r="13" fill="#e1ecdf"/><path d="M130 233l4 4 7-8" stroke="#456