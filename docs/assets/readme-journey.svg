<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc">
<title id="title">첫 답변까지 세 단계</title><desc id="desc">브라우저에서 Bridge를 열고 카카오톡에 보조 기기로 로그인해 휴대폰을 확인한 뒤 AI를 연결하고 직접 보낸 메시지를 찾아보세요. 이해를 돕기 위한 화면 예시입니다.</desc>
<rect x="0.5" y="0.5" width="1119" height="529" rx="24" fill="#f7f8f2" stroke="#dedfd5"/>
<text x="26" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" fill="#676b61" text-anchor="start">첫 답변을 여기서 시작하세요</text><text x="26" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="34" font-weight="650" fill="#272720" text-anchor="start">세 단계로 대화와 AI를 연결하세요.</text><g transform="translate(26 110)"><rect x="0" y="0" width="340" height="382" rx="18" fill="white" stroke="#dedfd5"/><rect x="22" y="22" width="34" height="34" rx="10" fill="#f6df80" stroke="none"/><text x="39" y="46" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#272720" text-anchor="middle">1</text><text x="22" y="91" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" fill="#272720" text-anchor="start">관리 화면 열기</text><rect x="22" y="115" width="296" height="164" rx="12" fill="#f7f8f4" stroke="#dedfd5"/><path d="M22 147h296" stroke="#dedfd5" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38" cy="132" r="3" fill="#babeb2"/><circle cx="49" cy="132" r="3" fill="#babeb2"/><circle cx="60" cy="132" r="3" fill="#babeb2"/><g transform="translate(38 165) scale(0.2265625)"><rect width="128" height="128" rx="28" fill="#f6df80"/><path d="M39 27h50a13 13 0 0 1 13 13v35a13 13 0 0 1-13 13H62l-22 17V88h-1a13 13 0 0 1-13-13V40a13 13 0 0 1 13-13Z" fill="#272720"/></g><text x="78" y="186" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="650" fill="#272720" text-anchor="start">내 Bridge</text><rect x="38" y="206" width="78" height="48" rx="7" fill="white" stroke="#dedfd5"/><rect x="48" y="218" width="37" height="5" rx="2" fill="#dfe3d6" stroke="none"/><rect x="48" y="233" width="55" height="7" rx="2" fill="#f6df80" stroke="none"/><rect x="128" y="206" width="78" height="48" rx="7" fill="white" stroke="#dedfd5"/><rect x="138" y="218" width="37" height="5" rx="2" fill="#dfe3d6" stroke="none"/><rect x="138" y="233" width="55" height="7" rx="2" fill="#f6df80" stroke="none"/><rect x="218" y="206" width="78" height="48" rx="7" fill="white" stroke="#dedfd5"/><rect x="228" y="218" width="37" height="5" rx="2" fill="#dfe3d6" stroke="none"/><rect x="228" y="233" width="55" height="7" rx="2" fill="#f6df80" stroke="none"/><text x="22" y="322" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#676b61" text-anchor="start">명령 하나로 시작하고</text><text x="22" y="351" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#676b61" text-anchor="start">브라우저에서 이어가세요.</text></g><g transform="translate(390 110)"><rect x="0" y="0" width="340" height="382" rx="18" fill="white" stroke="#dedfd5"/><rect x="22" y="22" width="34" height="34" rx="10" fill="#f6df80" stroke="none"/><text x="39" y="46" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#272720" text-anchor="middle">2</text><text x="22" y="91" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" fill="#272720" text-anchor="start">카카오톡 로그인</text><rect x="83" y="112" width="105" height="159" rx="14" fill="#f2f4eb" stroke="#272720"/><path d="M121 123h27" stroke="#676b61" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(112 154) scale(0.375)"><rect width="128" height="128" rx="28" fill="#f6df80"/><path d="M39 27h50a13 13 0 0 1 13 13v35a13 13 0 0 1-13 13H62l-22 17V88h-1a13 13 0 0 1-13-13V40a13 13 0 0 1 13-13Z" fill="#272720"/></g><circle cx="135" cy="233" r="13" fill="#e1ecdf"/><path d="M130 233l4 4 7-8" stroke="#456851" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="207" y="144" width="61" height="124" rx="12" fill="#f2f4eb" stroke="#272720"/><g transform="translate(222 170) scale(0.2421875)"><rect width="128" height="128" rx="28" fill="#f6df80"/><path d="M39 27h50a13 13 0 0 1 13 13v35a13 13 0 0 1-13 13H62l-22 17V88h-1a13 13 0 0 1-13-13V40a13 13 0 0 1 13-13Z" fill="#272720"/></g><circle cx="237" cy="237" r="13" fill="#e1ecdf"/><path d="M232 237l4 4 7-8" stroke="#456851" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M51 207v-32c0-10 6-16 16-16" stroke="#456851" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M61 154l7 5-7 5" stroke="#456851" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="22" y="322" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#676b61" text-anchor="start">휴대폰과 함께 사용하고</text><text x="22" y="351" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#676b61" text-anchor="start">두 기기의 로그인을 확인하세요.</text></g><g transform="translate(754 110)"><rect x="0" y="0" width="340" height="382" rx="18" fill="white" stroke="#dedfd5"/><rect x="22" y="22" width="34" height="34" rx="10" fill="#f6df80" stroke="none"/><text x="39" y="46" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#272720" text-anchor="middle">3</text><text x="22" y="91" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" fill="#272720" text-anchor="start">AI에게 질문하기</text><rect x="22" y="115" width="296" height="68" rx="12" fill="#f4f5ee" stroke="none"/><text x="40" y="143" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#272720" text-anchor="start">모임 약속이</text><text x="40" y="169" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#272720" text-anchor="start">어떻게 바뀌었어?</text><rect x="42" y="196" width="276" height="83" rx="12" fill="#fff7d8" stroke="none"/><circle cx="61" cy="219" r="4" fill="#456851"/><text x="75" y="226" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#272720" text-anchor="start">금요일 · 저녁 7시 30분</text><text x="60" y="254" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">7시에서 변경됐어요.</text><text x="22" y="322" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#676b61" text-anchor="start">AI 연결 방식을 선택하고</text><text x="22" y="351" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#676b61" text-anchor="start">직접 보낸 메시지를 찾아보세요.</text></g><text x="26" y="512" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#676b61" text-anchor="start">AI 연결은 선택 사항입니다. 필요할 때 연결하세요.</text>
</svg>
