 font-size="20" font-weight="500" fill="#272720" text-anchor="start">What changed in</text><text x="40" y="169" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#272720" text-anchor="start">the meetup plan?</text><rect x="42" y="196" width="276" height="83" rx="12" fill="#fff7d8" stroke="none"/><circle cx="61" cy="219" r="4" fill="#456851"/><text x="75" y="226" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650" fill="#272720" text-anchor="start">Friday · 7:30 PM</text><text x="60" y="254" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">Moved from 7 PM.</text><text x="22" y="322" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#676b61" text-anchor="start">Choose an AI connection.</text><text x="22" y="351" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#676b61" text-anchor="start">Try a message you sent.</text></g><text x="26" y="512" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#676b61" text-anchor="start">AI connection is optional. Connect whenever you’re ready.</text>
</svg>
