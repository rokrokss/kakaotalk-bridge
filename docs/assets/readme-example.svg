<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="482" viewBox="0 0 1120 482" role="img" aria-labelledby="title desc">
<title id="title">수집한 메시지에 대해 AI에게 물어보세요</title><desc id="desc">가상 예시: 같은 카페의 금요일 모임이 저녁 7시에서 7시 30분으로 바뀝니다. 연결된 AI가 수집한 두 메시지를 근거로 변경 내용을 설명합니다.</desc>
<rect x="0.5" y="0.5" width="1119" height="481" rx="24" fill="#f7f8f2" stroke="#dedfd5"/>
<text x="26" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" fill="#676b61" text-anchor="start">내 대화에서 찾는 답</text><text x="26" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="34" font-weight="650" fill="#272720" text-anchor="start">수집한 메시지로 물어보세요.</text><g transform="translate(26 112)"><rect x="0" y="0" width="444" height="334" rx="18" fill="white" stroke="#dedfd5"/><g transform="translate(24 22) scale(0.234375)"><rect width="128" height="128" rx="28" fill="#f6df80"/><path d="M39 27h50a13 13 0 0 1 13 13v35a13 13 0 0 1-13 13H62l-22 17V88h-1a13 13 0 0 1-13-13V40a13 13 0 0 1 13-13Z" fill="#272720"/></g><text x="67" y="44" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="650" fill="#272720" text-anchor="start">수집한 대화</text><rect x="24" y="77" width="327" height="78" rx="12" fill="#f0f2eb" stroke="none"/><text x="42" y="109" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#272720" text-anchor="start">금요일 모임은 저녁 7시야.</text><text x="42" y="136" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#272720" text-anchor="start">지난번 그 카페에서 만나.</text><text x="25" y="180" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#676b61" text-anchor="start">같은 대화의 다음 메시지</text><rect x="70" y="198" width="350" height="96" rx="12" fill="#f6df80" stroke="none"/><text x="88" y="233" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#272720" text-anchor="start">금요일 모임 7시 반으로 바뀌었어.</text><text x="88" y="262" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#272720" text-anchor="start">장소는 그대로야.</text></g><path d="M488 279h62m-7-7 7 7-7 7" stroke="#456851" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(584 112)"><rect x="0" y="0" width="510" height="334" rx="18" fill="#eef3ea" stroke="#d6dfd0"/><text x="24" y="43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#456851" text-anchor="start">연결한 AI</text><rect x="24" y="68" width="462" height="76" rx="12" fill="white" stroke="none"/><text x="44" y="99" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#272720" text-anchor="start">금요일 모임은 몇 시야?</text><text x="44" y="127" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#272720" text-anchor="start">장소도 바뀌었어?</text><text x="25" y="186" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="30" font-weight="650" fill="#272720" text-anchor="start">저녁 7시 30분, 같은 카페예요.</text><text x="25" y="224" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#456851" text-anchor="start">시간은 7시에서 7시 30분으로 바뀌었어요.</text><text x="25" y="254" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#456851" text-anchor="start">장소는 그대로예요.</text><path d="M25 278h459" stroke="#d6dfd0" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="25" y="310" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#456851" text-anchor="start">AI가 조회한 메시지를 근거로 답합니다.</text></g><text x="26" y="466" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#676b61" text-anchor="start">이해를 돕기 위한 가상 메시지와 AI 답변 예시입니다.</text>
</svg>
