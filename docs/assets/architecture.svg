<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="772" viewBox="0 0 1120 772" role="img" aria-labelledby="title desc">
  <title id="title">KakaoTalk Bridge architecture</title>
  <desc id="desc">An administrator signs in with a passkey and controls redroid through gateway and admin over private HTTPS and authenticated ADB. iris-collector authenticates to Iris inside redroid and stores messages through the API in SQLite. Your AI connects over public HTTPS through dot-ingress, which filters private cookies before forwarding to dot-plugin. The plugin queries the API with the read token. dot-control verifies passkeys with separate public assertion and private administration permissions. Phone sessions are confirmed manually; events require a separate subscription.</desc>
  <defs>
    <marker id="request" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="m2 2 5 3-5 3" fill="none" stroke="#77766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="data" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="m2 2 5 3-5 3" fill="none" stroke="#a1832e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1120" height="772" rx="16" fill="#faf9f6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" fill="#242320">
    <text x="32" y="45" font-size="24" font-weight="650">Access and message collection</text>
    <path d="M726 38h34" stroke="#77766e" stroke-width="2" marker-end="url(#request)"/>
    <text x="772" y="44" font-size="13" fill="#717069">Read/control</text>
    <path d="M905 38h34" stroke="#a1832e" stroke-width="2" marker-end="url(#data)"/>
    <text x="951" y="44" font-size="13" fill="#717069">Store messages</text>

    <rect x="48" y="92" width="270" height="94" rx="10" fill="#fff" stroke="#dedad0"/>
    <text x="72" y="130" font-size="22" font-weight="600">Admin browser</text>
    <text x="72" y="159" font-size="15" fill="#717069">Passkey · Screen control</text>
    <rect x="790" y="92" width="282" height="94" rx="10" fill="#fff" stroke="#dedad0"/>
    <text x="814" y="130" font-size="22" font-weight="600">Your AI</text>
    <text x="814" y="159" font-size="15" fill="#717069">Read messages · Search</text>

    <rect x="24" y="254" width="1072" height="464" rx="12" fill="#f1efe7" stroke="#dedad0"/>
    <text x="370" y="284" font-size="14" fill="#717069">Your server · Docker Compose</text>
    <path d="M183 186v126" fill="none" stroke="#77766e" stroke-width="2" marker-end="url(#request)"/>
    <text x="196" y="224" font-size="14" fill="#717069">Private HTTPS</text>
    <path d="M930 186v126" fill="none" stroke="#77766e" stroke-width="2" marker-end="url(#request)"/>
    <text x="765" y="224" font-size="14" fill="#717069">Public HTTPS + OAuth</text>

    <rect x="48" y="318" width="270" height="94" rx="8" fill="#fff" stroke="#dedad0"/>
    <text x="72" y="356" font-size="22" font-weight="600">Admin console</text>
    <text x="72" y="385" font-size="15" fill="#717069">gateway · admin</text>
    <rect x="810" y="318" width="238" height="94" rx="8" fill="#fff" stroke="#dedad0"/>
    <text x="834" y="356" font-size="22" font-weight="600">MCP plugin</text>
    <text x="834" y="383" font-size="13" fill="#717069">dot-ingress → dot-plugin</text>
    <text x="834" y="401" font-size="12" fill="#717069">Private cookies filtered</text>
    <path d="M183 412v80" fill="none" stroke="#77766e" stroke-width="2" marker-end="url(#request)"/>
    <text x="196" y="455" font-size="14" fill="#717069">Authenticated ADB</text>
    <path d="M930 412v138" fill="none" stroke="#77766e" stroke-width="2" marker-end="url(#request)"/>
    <text x="945" y="478" font-size="14" fill="#717069">Read token</text>

    <rect x="48" y="498" width="270" height="178" rx="8" fill="#fff" stroke="#dedad0"/>
    <text x="72" y="535" font-size="22" font-weight="600">Secondary tablet</text>
    <text x="72" y="562" font-size="15" fill="#717069">redroid · KakaoTalk</text>
    <rect x="68" y="588" width="230" height="66" rx="6" fill="#fbf3d6" stroke="#e2d5a5"/>
    <text x="85" y="614" font-size="17" font-weight="600">Iris</text>
    <text x="85" y="637" font-size="13" fill="#717069">Read the tablet database</text>

    <rect x="426" y="558" width="238" height="118" rx="8" fill="#fff" stroke="#dedad0"/>
    <text x="450" y="595" font-size="21" font-weight="600">iris-collector</text>
    <text x="450" y="623" font-size="15" fill="#717069">Fetch rows · Retry storage</text>
    <text x="450" y="650" font-size="13" fill="#717069">Bearer auth · ADB forward</text>
    <rect x="810" y="558" width="238" height="118" rx="8" fill="#fff" stroke="#dedad0"/>
    <text x="834" y="595" font-size="22" font-weight="600">Collection API</text>
    <text x="834" y="623" font-size="14" fill="#717069">SQLite · Messages and cursors</text>
    <text x="834" y="650" font-size="13" fill="#717069">30-day retention by default</text>
    <path d="M298 621h121" fill="none" stroke="#a1832e" stroke-width="2" marker-end="url(#data)"/>
    <path d="M664 621h139" fill="none" stroke="#a1832e" stroke-width="2" marker-end="url(#data)"/>
    <text x="735" y="608" text-anchor="middle" font-size="13" fill="#8a722c">Body · IDs</text>

    <text x="450" y="470" font-size="14" fill="#717069">Confirm the phone session manually</text>
    <text x="450" y="495" font-size="14" fill="#717069">Events require a separate subscription</text>
    <text x="32" y="744" font-size="12" fill="#717069">Main paths shown. dot-control verifies passkeys; public assertions and private administration use separate credentials.</text>
    <text x="32" y="762" font-size="12" fill="#717069">adb-init provisions collector keys before Android starts. device-agent reports device status to the API.</text>
  </g>
</svg>
