<svg xmlns="http://www.w3.org/2000/svg" width="392" height="674" viewBox="0 0 392 674" role="img" aria-labelledby="title desc">
<title id="title">첫 답변까지 세 단계</title><desc id="desc">브라우저에서 Bridge를 열고 카카오톡에 보조 기기로 로그인해 휴대폰을 확인한 뒤 AI를 연결하고 직접 보낸 메시지를 찾아보세요. 이해를 돕기 위한 화면 예시입니다.</desc>
<rect x="0.5" y="0.5" width="391" height="673" rx="24" fill="#f7f8f2" stroke="#dedfd5"/>
<text x="26" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" fill="#676b61" text-anchor="start">첫 답변을 여기서 시작하세요</text><text x="26" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="28" font-weight="650" fill="#272720" text-anchor="start">세 단계로 시작하세요.</text><g transform="translate(26 110)"><rect x="0" y="0" width="340" height="158" rx="18" fill="white" stroke="#dedfd5"/><rect x="18" y="20" width="30" height="30" rx="8" fill="#f6df80" stroke="none"/><text x="33" y="41" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#272720" text-anchor="middle">1</text><text x="62" y="43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" fill="#272720" text-anchor="start">관리 화면 열기</text><text x="62" y="82" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">명령 하나로 시작하고</text><text x="62" y="109" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">브라우저에서 이어가세요.</text><rect x="18" y="72" width="29" height="25" rx="4" fill="#f1f3ea" stroke="#dedfd5"/><path d="M18 79h29" stroke="#dedfd5" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(26 284)"><rect x="0" y="0" width="340" height="158" rx="18" fill="white" stroke="#dedfd5"/><rect x="18" y="20" width="30" height="30" rx="8" fill="#f6df80" stroke="none"/><text x="33" y="41" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#272720" text-anchor="middle">2</text><text x="62" y="43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" fill="#272720" text-anchor="start">카카오톡 로그인</text><text x="62" y="82" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">휴대폰과 함께 사용하고</text><text x="62" y="109" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">두 기기의 로그인을 확인하세요.</text><rect x="22" y="68" width="20" height="34" rx="4" fill="#f1f3ea" stroke="#dedfd5"/><path d="M28 73h8" stroke="#676b61" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(26 458)"><rect x="0" y="0" width="340" height="158" rx="18" fill="white" stroke="#dedfd5"/><rect x="18" y="20" width="30" height="30" rx="8" fill="#f6df80" stroke="none"/><text x="33" y="41" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#272720" text-anchor="middle">3</text><text x="62" y="43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" fill="#272720" text-anchor="start">AI에게 질문하기</text><text x="62" y="82" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">연결 방식을 선택하고</text><text x="62" y="109" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">직접 보낸 메시지를 찾아보세요.</text><g transform="translate(18 70) scale(0.234375)"><rect width="128" height="128" rx="28" fill="#f6df80"/><path d="M39 27h50a13 13 0 0 1 13 13v35a13 13 0 0 1-13 13H62l-22 17V88h-1a13 13 0 0 1-13-13V40a13 13 0 0 1 13-13Z" fill="#272720"/></g></g><text x="26" y="642" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#676b61" text-anchor="start">AI 연결은 선택 사항입니다.</text><text x="26" y="660" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#676b61" text-anchor="start">필요할 때 연결하세요.</text>
</svg>
