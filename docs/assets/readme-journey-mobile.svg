<svg xmlns="http://www.w3.org/2000/svg" width="392" height="674" viewBox="0 0 392 674" role="img" aria-labelledby="title desc">
<title id="title">Three steps to your first answer</title><desc id="desc">Open the bridge in your browser, sign in to KakaoTalk as a secondary device and confirm your phone, then connect an AI and try a message you sent. Illustrative UI.</desc>
<rect x="0.5" y="0.5" width="391" height="673" rx="24" fill="#f7f8f2" stroke="#dedfd5"/>
<text x="26" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" fill="#676b61" text-anchor="start">YOUR FIRST ANSWER STARTS HERE</text><text x="26" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="28" font-weight="650" fill="#272720" text-anchor="start">Three steps. One bridge.</text><g transform="translate(26 110)"><rect x="0" y="0" width="340" height="158" rx="18" fill="white" stroke="#dedfd5"/><rect x="18" y="20" width="30" height="30" rx="8" fill="#f6df80" stroke="none"/><text x="33" y="41" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#272720" text-anchor="middle">1</text><text x="62" y="43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" fill="#272720" text-anchor="start">Open your bridge</text><text x="62" y="82" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">Run one command.</text><text x="62" y="109" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">Continue in your browser.</text><rect x="18" y="72" width="29" height="25" rx="4" fill="#f1f3ea" stroke="#dedfd5"/><path d="M18 79h29" stroke="#dedfd5" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(26 284)"><rect x="0" y="0" width="340" height="158" rx="18" fill="white" stroke="#dedfd5"/><rect x="18" y="20" width="30" height="30" rx="8" fill="#f6df80" stroke="none"/><text x="33" y="41" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#272720" text-anchor="middle">2</text><text x="62" y="43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" fill="#272720" text-anchor="start">Sign in to KakaoTalk</text><text x="62" y="82" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">Use it with your phone.</text><text x="62" y="109" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">Confirm both sessions.</text><rect x="22" y="68" width="20" height="34" rx="4" fill="#f1f3ea" stroke="#dedfd5"/><path d="M28 73h8" stroke="#676b61" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(26 458)"><rect x="0" y="0" width="340" height="158" rx="18" fill="white" stroke="#dedfd5"/><rect x="18" y="20" width="30" height="30" rx="8" fill="#f6df80" stroke="none"/><text x="33" y="41" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#272720" text-anchor="middle">3</text><text x="62" y="43" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="650" fill="#272720" text-anchor="start">Ask your AI</text><text x="62" y="82" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">Choose a connection.</text><text x="62" y="109" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#676b61" text-anchor="start">Try a message you sent.</text><g transform="translate(18 70) scale(0.234375)"><rect width="128" height="128" rx="28" fill="#f6df80"/><path d="M39 27h50a13 13 0 0 1 13 13v35a13 13 0 0 1-13 13H62l-22 17V88h-1a13 13 0 0 1-13-13V40a13 13 0 0 1 13-13Z" fill="#272720"/></g></g><text x="26" y="642" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#676b61" text-anchor="start">AI connection is optional.</text><text x="26" y="660" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#676b61" text-anchor="start">Connect whenever you’re ready.</text>
</svg>
