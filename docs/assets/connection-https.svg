<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="432" viewBox="0 0 1120 432" role="img" aria-labelledby="title desc">
<title id="title">HTTPS with OAuth</title>
<desc id="desc">An AI client reaches a public HTTPS address supplied by Tailscale Funnel or a reverse proxy. The owner approves with a passkey in the browser. The proxy forwards authenticated requests to the OAuth MCP endpoint, which reads collected messages on the server.</desc>
<defs>
<marker id="arrow-line" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#85857b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#3b697f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-goldink" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#8c691e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#47735e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="432" rx="20" fill="#faf9f6" stroke="none"/>
<rect x="32" y="30" width="44" height="34" rx="9" fill="#f6df80" stroke="none"/>
<text x="54" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#242320" text-anchor="middle">01</text>
<text x="92" y="55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="650" fill="#242320" text-anchor="start">HTTPS with OAuth</text>
<text x="32" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#6f7069" text-anchor="start">For ChatGPT and other clients that connect to a public MCP URL.</text>
<rect x="876" y="32" width="212" height="30" rx="15.0" fill="#ffffff" stroke="none"/>
<text x="982.0" y="50.85" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6f7069" text-anchor="middle">PUBLIC MCP ADDRESS</text>
<rect x="596" y="116" width="492" height="176" rx="14" fill="#f1efe7" stroke="#dedad0"/>
<text x="616" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#6f7069" text-anchor="start">Your server / VM</text>
<rect x="32" y="174" width="208" height="98" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="48" y="193" width="5" height="24" rx="2" fill="#3b697f" stroke="none"/>
<text x="64" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#242320" text-anchor="start">AI client</text>
<text x="50" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">ChatGPT / other clients</text>
<rect x="336" y="174" width="208" height="98" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="352" y="193" width="5" height="24" rx="2" fill="#f6df80" stroke="none"/>
<text x="368" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#242320" text-anchor="start">Public HTTPS</text>
<text x="354" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">Funnel / reverse proxy</text>
<rect x="616" y="174" width="188" height="98" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="632" y="193" width="5" height="24" rx="2" fill="#f6df80" stroke="none"/>
<text x="648" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#242320" text-anchor="start">OAuth MCP</text>
<text x="634" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">/mcp endpoint</text>
<rect x="900" y="174" width="168" height="98" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="916" y="193" width="5" height="24" rx="2" fill="#f6df80" stroke="none"/>
<text x="932" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#242320" text-anchor="start">Messages</text>
<text x="918" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">Stored locally</text>
<path d="M251 223 L325 223" fill="none" stroke="#3b697f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
<text x="288" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#3b697f" text-anchor="middle">OAuth token</text>
<path d="M555 223 L605 223" fill="none" stroke="#85857b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-line)" marker-end="url(#arrow-line)"/>
<text x="580" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#6f7069" text-anchor="middle">Proxy</text>
<path d="M815 223 L889 223" fill="none" stroke="#85857b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-line)" marker-end="url(#arrow-line)"/>
<text x="852" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#6f7069" text-anchor="middle">Read API</text>
<rect x="32" y="322" width="208" height="78" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="48" y="341" width="5" height="24" rx="2" fill="#47735e" stroke="none"/>
<text x="64" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#242320" text-anchor="start">Your browser</text>
<text x="50" y="378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">Owner approval</text>
<path d="M251 361 L440 361 L440 283" fill="none" stroke="#47735e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arrow-green)"/>
<text x="345" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#47735e" text-anchor="middle">Passkey + consent</text>
<text x="616" y="345" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#242320" text-anchor="start">Messages stay on your server.</text>
<text x="616" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">Requested results return through the same path.</text>
</svg>
