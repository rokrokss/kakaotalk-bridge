<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="562" viewBox="0 0 1120 562" role="img" aria-labelledby="title desc">
<title id="title">개인 OpenAI 터널</title>
<desc id="desc">서버의 터널 클라이언트가 OpenAI에 HTTPS로 연결하고 이 연결로 ChatGPT의 MCP 요청과 결과를 전달합니다. 내부 인증 정보로 비공개 MCP에 접근합니다. 소유자는 별도로 localhost·SSH·HTTPS 관리 화면에서 패스키로 로그인하고 자동 만료 없는 접근을 승인합니다.</desc>
<defs>
<marker id="arrow-line" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#85857b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#3b697f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-goldink" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#8c691e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#47735e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="562" rx="20" fill="#faf9f6" stroke="none"/>
<rect x="32" y="30" width="44" height="34" rx="9" fill="#f6df80" stroke="none"/>
<text x="54" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#242320" text-anchor="middle">02</text>
<text x="92" y="55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="650" fill="#242320" text-anchor="start">개인 OpenAI 터널</text>
<text x="32" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#6f7069" text-anchor="start">서버가 연결을 시작하면 ChatGPT가 이 연결로 비공개 MCP에 접근합니다.</text>
<rect x="876" y="32" width="212" height="30" rx="15.0" fill="#ffffff" stroke="none"/>
<text x="982.0" y="50.85" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6f7069" text-anchor="middle">공개 MCP 주소 불필요</text>
<rect x="360" y="116" width="728" height="402" rx="14" fill="#f1efe7" stroke="#dedad0"/>
<text x="384" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#6f7069" text-anchor="start">내 서버 / VM</text>
<text x="1064" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#6f7069" text-anchor="end">터널 포트 공개 없음</text>
<rect x="32" y="202" width="232" height="100" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="48" y="221" width="5" height="24" rx="2" fill="#3b697f" stroke="none"/>
<text x="64" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="23" font-weight="600" fill="#242320" text-anchor="start">ChatGPT</text>
<text x="50" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">OpenAI 터널 서비스</text>
<rect x="392" y="202" width="192" height="100" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="408" y="221" width="5" height="24" rx="2" fill="#3b697f" stroke="none"/>
<text x="424" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#242320" text-anchor="start">터널 클라이언트</text>
<text x="410" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">OpenAI 실행용 키</text>
