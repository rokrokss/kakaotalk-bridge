<rect x="720" y="221" width="5" height="24" rx="2" fill="#f6df80" stroke="none"/>
<text x="736" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#242320" text-anchor="start">비공개 MCP</text>
<text x="722" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">내부 서비스 접근</text>
<rect x="960" y="202" width="104" height="100" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="976" y="221" width="5" height="24" rx="2" fill="#f6df80" stroke="none"/>
<text x="992" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600" fill="#242320" text-anchor="start">데이터</text>
<text x="978" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">메시지</text>
<path d="M488 191 L488 178 L148 178 L148 191" fill="none" stroke="#8c691e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arrow-goldink)"/>
<text x="305" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#8c691e" text-anchor="middle">서버에서 HTTPS 연결 시작</text>
<path d="M275 251 L381 251" fill="none" stroke="#3b697f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
<text x="328" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#3b697f" text-anchor="middle">MCP 요청·응답</text>
<text x="328" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#6f7069" text-anchor="middle">기존 연결 사용</text>
<path d="M595 251 L693 251" fill="none" stroke="#85857b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-line)" marker-end="url(#arrow-line)"/>
<text x="644" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#6f7069" text-anchor="middle">내부 인증 정보</text>
<path d="M891 251 L949 251" fill="none" stroke="#85857b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow-line)" marker-end="url(#arrow-line)"/>
<text x="920" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#6f7069" text-anchor="middle">조회 API</text>
<rect x="32" y="408" width="232" height="84" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="48" y="427" width="5" height="24" rx="2" fill="#47735e" stroke="none"/>
<text x="64" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="#242320" text-anchor="start">내 브라우저</text>
<text x="50" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">비공개 관리 접근</text>
<rect x="392" y="408" width="192" height="84" rx="12" fill="#ffffff" stroke="#dedad0"/>
<rect x="408" y="427" width="5" height="24" rx="2" fill="#47735e" stroke="none"/>
<text x="424" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#242320" text-anchor="start">관리 화면</text>
<text x="410" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">패스키 로그인</text>
<path d="M275 450 L381 450" fill="none" stroke="#47735e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="328" y="433" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#47735e" text-anchor="middle">관리 화면 접근</text>
<text x="328" y="475" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#6f7069" text-anchor="middle">로컬 · SSH · HTTPS</text>
<path d="M595 450 L792 450 L792 313" fill="none" stroke="#47735e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arrow-green)"/>
<text x="812" y="368" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#47735e" text-anchor="start">소유자 승인</text>
<text x="812" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#6f7069" text-anchor="start">자동 만료 없음</text>
<text x="32" y="541" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#6f7069" text-anchor="start">점선: 연결 설정·승인 / 실선: MCP 요청·응답과 브라우저 접근</text>
