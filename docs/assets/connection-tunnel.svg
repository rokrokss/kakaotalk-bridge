<text x="328" y="475" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#6f7069" text-anchor="middle">Local · SSH · HTTPS</text>
<path d="M595 450 L792 450 L792 313" fill="none" stroke="#47735e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arrow-green)"/>
