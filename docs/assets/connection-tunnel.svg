<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="562" viewBox="0 0 1120 562" role="img" aria-labelledby="title desc">
<title id="title">Personal OpenAI tunnel</title>
<desc id="desc">The tunnel client on your server opens outbound HTTPS to OpenAI. ChatGPT MCP requests and results travel over that existing connection. The client authenticates to a private MCP listener with a local service credential. Separately, the owner signs into the admin console over localhost, SSH forwarding or HTTPS with a passkey and approves access without automatic expiration.</desc>
<defs>
<marker id="arrow-line" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#85857b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#3b697f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-goldink" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#8c691e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#47735e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="562" rx="20" fill="#faf9f6" stroke="none"/>
<rect x="32" y="30" width="44" height="34" rx="9" fill="#f6df80" stroke="none"/>
<text x="54" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#242320" text-anchor="middle">02</text>
<text x="92" y="55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="650" fill="#242320" text-anchor="start">Personal OpenAI tunnel</text>
<text x="32" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="400" fill="#6f7069" text-anchor="start">The server opens the connection. ChatGPT uses it to reach your private MCP.</text>
<rect x="876" y="32" width="212" height="30" rx="15.0" fill="#ffffff" stroke="none"/>
<text x="982.0" y="50.85" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#6f7069" text-anchor="middle">NO PUBLIC MCP ADDRESS</text>
<rect x="360" y="116" width="728" height="402" rx="14" fill="#f1efe7" stroke="#dedad0"/>
<text x="384" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#6f7069" text-anchor="start">Your server / VM</text>
<text x="1064" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="#6f7069" text-anchor="end">No published tunnel port</text>
